name: Validate storefront

on:
  push:
    branches: [main, "glowup/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check store.js

      - name: Validate storefront structure
        run: node scripts/validate.mjs
